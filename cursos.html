<style>
/* ══ PÁGINA DE CURSOS · prefijo cs- ══ */
body{background:#0D0005;color:#F0E6D3;}
.cs-prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--c1l),var(--gold));z-index:200;width:0;transition:width .1s linear;}
.cs-nav{position:sticky;top:0;z-index:120;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;height:66px;background:rgba(13,0,5,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(201,168,76,.18);}
.cs-brand{font-family:var(--fd);font-size:21px;font-weight:600;color:var(--goldl);text-decoration:none;letter-spacing:.05em;}
.cs-nav-l{display:flex;gap:22px;align-items:center;}
.cs-nav-l a{font-size:13.5px;color:rgba(255,248,240,.7);text-decoration:none;transition:.2s;}
.cs-nav-l a:hover,.cs-nav-l a.act{color:var(--goldl);}
.cs-sec{padding:74px 5vw;}
.cs-in{max-width:1150px;margin:0 auto;}
.cs-claro{background:#FFF8F0;color:#1A0008;}
.cs-kicker{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--goldd);margin-bottom:12px;display:block;}
.cs-tit{font-family:var(--fd);font-size:clamp(28px,4.2vw,46px);font-weight:400;line-height:1.12;margin-bottom:12px;text-wrap:balance;}
.cs-tit em{font-style:italic;color:var(--gold);}
.cs-claro .cs-tit{color:#2A0818;}
.cs-sub{font-size:15px;line-height:1.7;color:rgba(255,248,240,.65);max-width:620px;margin-bottom:34px;}
.cs-claro .cs-sub{color:#6A464E;}
/* Hero */
.cs-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:46px;align-items:center;padding:64px 5vw 74px;max-width:1200px;margin:0 auto;}
.cs-hero h1{font-family:var(--fd);font-size:clamp(36px,5.4vw,62px);font-weight:300;line-height:1.06;color:#FFF8F0;margin-bottom:18px;text-wrap:balance;}
.cs-hero h1 em{font-style:italic;color:var(--goldl);}
.cs-hero p.cs-hsub{font-size:16px;line-height:1.7;color:rgba(255,248,240,.72);max-width:520px;margin-bottom:26px;}
.cs-acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.cs-nota{font-size:12.5px;color:rgba(255,248,240,.5);margin-top:12px;}
/* Maqueta del reproductor */
.cs-prev{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(201,168,76,.25);border-radius:20px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.45);}
.cs-prev-top{position:relative;aspect-ratio:16/9;border-radius:13px;overflow:hidden;background:linear-gradient(135deg,#3D0015,#8C0026);}
.cs-prev-top img{width:100%;height:100%;object-fit:cover;}
.cs-prev-ph{width:100%;height:100%;}
.cs-prev-play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(13,0,5,.55);border:1px solid var(--gold);color:var(--goldl);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.cs-prev-body{padding:14px 6px 4px;}
.cs-prev-tit{font-family:var(--fd);font-size:17px;color:var(--goldl);margin-bottom:9px;}
.cs-prev-bar{height:5px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px;}
.cs-prev-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1l),var(--gold));}
.cs-prev-les{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(201,168,76,.12);font-size:12.5px;}
.cs-prev-n{width:20px;height:20px;border-radius:50%;border:1px solid rgba(201,168,76,.4);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;}
.cs-prev-lt{flex:1;color:rgba(255,248,240,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs-prev-ld{color:rgba(255,248,240,.42);font-size:11.5px;}
/* Franja de datos */
.cs-tira{background:#FFF8F0;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 40px;padding:22px 5vw;}
.cs-dato{display:flex;align-items:center;gap:8px;font-size:13px;color:#6A464E;}
.cs-dato-ic{color:var(--goldd);display:flex;}
/* Tarjetas para quién */
.cs-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
.cs-card{background:#fff;border:1px solid #F0E2D4;border-radius:18px;padding:26px 24px;transition:.25s;}
.cs-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 40px rgba(98,0,24,.09);}
.cs-card-n{font-family:var(--fd);font-size:14px;font-style:italic;color:var(--goldd);letter-spacing:.2em;margin-bottom:8px;}
.cs-card h3{font-family:var(--fd);font-size:21px;font-weight:500;color:#2A0818;margin-bottom:8px;}
.cs-card p{font-size:13.5px;line-height:1.7;color:#6A464E;}
/* Ficha del curso */
.cs-ficha{display:grid;grid-template-columns:.85fr 1.15fr;gap:32px;align-items:center;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(201,168,76,.3);border-radius:24px;padding:26px;max-width:1000px;margin:0 auto;}
.cs-ficha-media{border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,#3D0015,#8C0026);}
.cs-ficha-media img{width:100%;height:100%;object-fit:cover;}
.cs-ficha-ph{width:100%;height:100%;}
.cs-chip-on{display:inline-block;background:var(--gold);color:#1A0008;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:50px;margin-bottom:12px;}
.cs-ficha-info h3{font-family:var(--fd);font-size:clamp(24px,3.2vw,33px);font-weight:500;color:var(--goldl);line-height:1.15;}
.cs-ficha-sub{font-family:var(--fd);font-size:16px;font-style:italic;color:rgba(255,248,240,.6);margin-bottom:12px;}
.cs-ficha-desc{font-size:14px;line-height:1.75;color:rgba(255,248,240,.72);margin-bottom:16px;}
.cs-ficha-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.cs-ficha-meta span{font-size:11.5px;color:rgba(255,248,240,.6);border:1px solid rgba(201,168,76,.28);border-radius:50px;padding:5px 13px;}
.cs-btn-big{padding:14px 32px;font-size:15px;}
.cs-pie{text-align:center;font-size:12.5px;color:rgba(255,248,240,.45);margin-top:16px;}
/* Qué vas a aprender */
.cs-aps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px 30px;margin-bottom:52px;}
.cs-ap{display:flex;gap:13px;align-items:flex-start;}
.cs-ap-ic{width:26px;height:26px;border-radius:50%;background:rgba(201,168,76,.16);color:var(--goldd);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.cs-ap h4{font-size:14.5px;font-weight:600;color:#2A0818;margin-bottom:4px;}
.cs-ap p{font-size:13.5px;line-height:1.65;color:#6A464E;}
/* Temario */
.cs-mod{background:#fff;border:1px solid #F0E2D4;border-radius:14px;margin-bottom:10px;overflow:hidden;}
.cs-mod-h{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--fb);}
.cs-mod-n{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--goldd);font-weight:600;}
.cs-mod-t{flex:1;font-family:var(--fd);font-size:18px;font-weight:500;color:#2A0818;}
.cs-mod-c{font-size:12px;color:#8A6A72;white-space:nowrap;}
.cs-mod-chev{color:var(--goldd);transition:transform .3s;}
.cs-mod.open .cs-mod-chev{transform:rotate(180deg);}
.cs-mod-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.cs-mod.open .cs-mod-body{max-height:600px;}
.cs-les{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid #F7EEE4;font-size:13.5px;}
.cs-les-n{font-family:var(--fd);color:var(--goldd);font-size:13px;width:22px;flex-shrink:0;}
.cs-les-t{flex:1;color:#3A2028;}
.cs-les-d{font-size:12px;color:#A08088;white-space:nowrap;}
/* Pasos */
.cs-pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 32px;}
.cs-paso{display:flex;gap:14px;align-items:flex-start;}
.cs-paso-n{font-family:var(--fd);font-size:26px;color:var(--gold);opacity:.8;line-height:1;flex-shrink:0;}
.cs-paso h4{font-size:15px;font-weight:600;color:var(--goldl);margin-bottom:5px;}
.cs-paso p{font-size:13.5px;line-height:1.7;color:rgba(255,248,240,.62);}
/* Hoja de ruta */
.cs-ruta{max-width:760px;margin:0 auto;position:relative;}
.cs-ruta::before{content:'';position:absolute;left:17px;top:14px;bottom:14px;width:1px;background:linear-gradient(180deg,var(--gold),rgba(201,168,76,.15));}
.cs-hito{display:flex;gap:18px;margin-bottom:20px;position:relative;}
.cs-hito-p{width:36px;height:36px;border-radius:50%;border:1px solid rgba(140,0,38,.25);background:#FFF8F0;color:#A08088;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;flex-shrink:0;z-index:1;}
.cs-hito.on .cs-hito-p{background:var(--gold);border-color:var(--gold);color:#1A0008;font-weight:600;}
.cs-hito-b{flex:1;padding-top:5px;}
.cs-hito-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px;}
.cs-hito-h h4{font-family:var(--fd);font-size:19px;font-weight:500;color:#2A0818;}
.cs-hito-chip{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:50px;background:#F3E4D6;color:#8A6A72;}
.cs-hito-chip.on{background:var(--gold);color:#1A0008;}
.cs-hito-b p{font-size:13.5px;line-height:1.65;color:#6A464E;}
/* Quién te enseña */
.cs-estudio{position:relative;min-height:66vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:70px 5vw;}
.cs-estudio img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:heroKb 26s ease-in-out infinite alternate;}
.cs-estudio-ov{position:absolute;inset:0;background:linear-gradient(160deg,rgba(26,0,8,.85),rgba(98,0,24,.6) 55%,rgba(26,0,8,.9));}
.cs-estudio-c{position:relative;z-index:2;max-width:680px;}
.cs-estudio-c p{font-size:16.5px;line-height:1.85;color:rgba(255,248,240,.85);font-family:var(--fd);font-style:italic;text-shadow:0 1px 14px rgba(13,0,5,.5);margin-bottom:20px;}
.cs-estudio-c a{color:var(--goldl);font-size:13.5px;}
/* Testimonios */
.cs-revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;}
.cs-rev{background:#fff;border:1px solid #F0E2D4;border-radius:18px;padding:24px;}
.cs-rev-st{color:var(--gold);letter-spacing:3px;margin-bottom:10px;}
.cs-rev p{font-family:var(--fd);font-size:16.5px;font-style:italic;line-height:1.6;color:#3A2028;margin-bottom:14px;}
.cs-rev-w{display:flex;align-items:center;gap:11px;}
.cs-rev-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c1l));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;}
.cs-rev-w b{display:block;font-size:13.5px;color:#2A0818;font-weight:500;}
.cs-rev-w i{font-size:12px;color:#8A6A72;font-style:normal;}
/* FAQ */
.cs-faq{max-width:760px;margin:0 auto;}
.cs-fq{border-bottom:1px solid #F0E2D4;}
.cs-fq-q{width:100%;background:none;border:none;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 2px;font-family:var(--fd);font-size:18px;font-weight:500;color:#2A0818;cursor:pointer;}
.cs-fq-q:hover{color:var(--c1);}
.cs-fq-chev{font-size:13px;color:var(--goldd);transition:transform .3s;flex-shrink:0;}
.cs-fq.open .cs-fq-chev{transform:rotate(180deg);}
.cs-fq-a{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;}
.cs-fq.open .cs-fq-a{max-height:340px;padding-bottom:17px;}
.cs-fq-a p{font-size:14px;line-height:1.75;color:#5A3A44;}
/* CTA final */
.cs-cta{background:linear-gradient(120deg,#620018,#8C0026);text-align:center;padding:76px 5vw;}
.cs-cta h2{font-family:var(--fd);font-size:clamp(28px,4.4vw,46px);font-weight:400;color:#FFF8F0;margin-bottom:12px;}
.cs-cta h2 em{font-style:italic;color:var(--goldl);}
.cs-cta p{font-size:15px;color:rgba(255,248,240,.75);margin-bottom:26px;}
.cs-cta-link{display:block;margin-top:16px;font-size:13px;color:rgba(255,248,240,.65);background:none;border:none;cursor:pointer;font-family:var(--fb);text-decoration:underline;width:100%;}
.cs-footer{background:#0D0005;color:rgba(255,248,240,.5);text-align:center;padding:26px 5vw;font-size:13px;}
.cs-footer a{color:var(--goldl);text-decoration:none;}
/* Barra fija en móvil */
.cs-sticky{display:none;position:fixed;left:0;right:0;bottom:0;z-index:130;background:rgba(13,0,5,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(201,168,76,.25);padding:10px 16px;align-items:center;justify-content:space-between;gap:12px;}
.cs-sticky span{font-size:12.5px;color:var(--goldl);}
@media(max-width:900px){
  .cs-hero{grid-template-columns:1fr;gap:30px;padding-top:38px;}
  .cs-ficha{grid-template-columns:1fr;}
  .cs-nav-l a:not(.cs-nav-btn){display:none;}
}
@media(max-width:600px){
  .cs-sec{padding:52px 5vw;}
  .cs-sticky{display:flex;}
  body{padding-bottom:62px;}
  .cs-acts .btn-gold,.cs-acts .btn-g{width:100%;text-align:center;}
}
</style>
</head>

<script>
// La sesión de esta página lleva al área de alumnas
function loginOk(u){
  currentUser = u;
  localStorage.setItem(KS, JSON.stringify(u));
  window.location.href = (u.role === 'admin') ? 'admin.html' : 'dashboard.html';
}
function doLogout(){ currentUser = null; localStorage.removeItem(KS); if(_fbReady && _auth) _auth.signOut().catch(()=>{}); }

document.addEventListener('DOMContentLoaded', ()=>{
  initFirebase();
  renderCursosPage();
  setTimeout(renderCursosPage, 2500); // por si la nube trae datos más nuevos
  // Barra de progreso de lectura
  const pb = document.getElementById('cs-prog');
  const upd = ()=>{
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if(pb) pb.style.width = (h>0 ? Math.min(100, y/h*100) : 0) + '%';
  };
  window.addEventListener('scroll', upd, {passive:true});
  document.body.addEventListener('scroll', upd, {passive:true});
  upd();
});
</script>
